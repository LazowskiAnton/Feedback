name: "OutputSmith: line not recognized"
description: A line of the Output window that should be colored differently.
labels: ["OutputSmith", "output line"]
body:
  - type: markdown
    attributes:
      value: |
        OutputSmith colors only formats it knows, so new tools and libraries need a sample. Issues are public: **replace company, product, project and person names and paths** with neutral ones (for example `Contoso`, `D:\src\App`) — keep the structure of the line.
  - type: dropdown
    id: pane
    attributes:
      label: Pane
      options:
        - Build
        - Build Order
        - Debug
        - Tests
        - Package Manager
        - CMake
        - Other
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or library
      description: What writes these lines, if you know.
      placeholder: "MSBuild task, xUnit 2.8, Serilog 4, a CLI tool…"
  - type: textarea
    id: lines
    attributes:
      label: Lines
      description: The lines as they are in the Output window, with a few lines around them.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: How they should look
      description: For example "error", "warning", "success", "noise (gray)", or "the file path should be a link".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OutputSmith version
      placeholder: "1.0.1"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I replaced private names and paths in the lines above.
          required: true
